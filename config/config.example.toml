# 个人 Agent —— 配置文件模板
#
# 默认路径：<项目根>/config/config.toml（相对当前工作目录）
# 可用环境变量 AGENT_CONFIG 覆盖为任意路径。
#
# 本文件是模板（config.example.toml），请复制为 config.toml 后填写；
# 也可直接运行 agent —— 检测到 config/config.toml 缺失或无效时
# 会自动进入配置向导生成它。
#
# 一键覆盖：用 `cargo xtask gen-cfg` 重新写一份模板。
#
# ============================================================
#  ⚠️  安全原则
# ============================================================
# - **两种 key 写法，环境变量优先**：
#     api_key_env = "DEEPSEEK_API_KEY"   # 只记环境变量名（最安全）
#     api_key      = "sk-真实key"          # 明文兜底（本文件已被 gitignore）
#   解析顺序：环境变量有值 → 用环境变量；否则 → 用明文 api_key。
# - config/config.toml 已在 .gitignore 中，不会提交，因此允许明文。
#   但共享/备份这台机器时仍需注意——文件里就是真实 key。
# - 环境变量存在但为空白串时视为未设置，继续走明文兜底。
#
# Windows (PowerShell):
#     setx DEEPSEEK_API_KEY "sk-xxxx"
# Linux / macOS:
#     export DEEPSEEK_API_KEY=sk-xxxx    # 加进 ~/.bashrc / ~/.zshrc
#
# ============================================================
#  📦  providers —— 所有可用的 LLM 端点
# ============================================================
# 每个 provider 必须有唯一的 key（hashmap key），后面 router 引用这个 key。

[providers.deepseek]
kind            = "openai_compat"            # 适配器类型（当前仅 openai_compat）
base_url        = "https://api.deepseek.com/v1"
api_key_env     = "DEEPSEEK_API_KEY"         # ← 优先：key 从这个环境变量取
# api_key       = "sk-你的key"               # ← 兜底：环境变量未设时用这个（可省略）
model           = "deepseek-chat"
tools           = true                       # 是否支持 tool/function calling
reasoning       = true                       # 是否发回思考链（reasoning_effort）
vision          = false
max_context     = 128000
input_per_1k    = 0.0014                     # USD / 1K input tokens（预算估算用）
output_per_1k   = 0.0028                     # USD / 1K output tokens

[providers.qwen]
kind            = "openai_compat"
base_url        = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env     = "DASHSCOPE_API_KEY"
model           = "qwen-max"
tools           = true
reasoning       = false
vision          = false
max_context     = 128000
input_per_1k    = 0.0016
output_per_1k   = 0.0064

# Ollama 本地（无需 key）—— 注意 TOML 无 null 字面量，
# 「无需 key」的表达方式是同时省略 api_key_env 与 api_key 两行。
[providers.ollama]
kind            = "openai_compat"
base_url        = "http://localhost:11434/v1"
# api_key_env   = "SOME_ENV"                 # 本地 Ollama 可整行省略（默认 None）
# api_key       = "sk-xxx"
model           = "qwen2.5-coder"
tools           = true
reasoning       = false
vision          = false
max_context     = 32000
input_per_1k    = 0.0
output_per_1k   = 0.0

# ============================================================
#  🔀  router —— 任务 → provider 的路由
# ============================================================
# `default` 用于没匹配到 by_task 时；`by_task` 按任务类型给有序候选，
# 第一个失败（超时/401/解析错）顺延。

[router]
default = "deepseek"        # 全局默认 provider 名（必须在 providers 里存在）

[router.by_task]
code      = ["deepseek", "qwen"]       # 写代码任务的有序候选
news      = ["qwen", "deepseek"]       # 新闻收集任务
# sensitive = ["ollama"]              # 隐私数据强制走本地（示例，按需开启）

# ============================================================
#  💰  budget —— 成本熔断
# ============================================================
# 单任务或月度超过限额会中止并提示。

[budget]
monthly_limit_usd  = 20.0
per_task_limit_usd = 0.5

# ============================================================
#  🔍  search —— 网络搜索
# ============================================================
# web_search 工具的 SearXNG 端点（自建）。未配置时 web_search 会失败并给出明确提示。

# 「不启用搜索」的表达方式：省略 searxng_endpoint 这一行。
[search]
# searxng_endpoint = "http://localhost:8080/search"   # 示例

# ============================================================
#  ⚙️  agent —— 工作区与执行参数
# ============================================================
# 改这些字段后无需重启 wizard，直接编辑本文件即可。

[agent]
# 私有数据根目录：日志与每任务的 ctx 外置输出放这里。
root                       = "~/agent"
# 项目根目录 = 工具读写的沙箱，也是相对路径的基准。
# `.` 表示**启动 agent 时的当前目录**（推荐：先 cd 到你的项目再启动）。
# 也支持绝对路径与 `~`；设成它，工具才能真正看到你的项目文件。
project_root               = "."
default_tier               = "L2"        # L1 全自动 / L2 AI 审视 / L3 逐步确认
max_iterations             = 25          # 单任务最大迭代轮（防死循环）
transient_retention_days   = 7           # 临时信息保留天数（P4）

# ============================================================
#  📝  log —— 审计日志
# ============================================================
# 目录：`agent.root/logs/`（跟着上面的 root 走，**不在 config/ 下**），
# 可用环境变量 AGENT_LOG_DIR 覆盖。里面两类文件：
#   agent.log            运行期 tracing 日志
#   <task-id>.jsonl      事件流（唯一真相源：一问一答、工具调用与返回原文）
# 事件流用 `cargo xtask log` 读：加 `--errors` 只看失败项，
# 加 `--full` 展开完整上下文。

[log]
save_context      = true    # 每轮记录一份完整上下文（system 固定区 + 全部历史消息）
save_stream_deltas = false  # 逐字记录流式增量（默认关：内容已由整轮回复覆盖，开着会大一数量级）
